            <div onclick="window.location.href='TCTC2-0-details.html'">常見問題</div>
            <div class="nav_dropdown">
                模式 <span class="nav_dropdown_arrow">≡</span>
                <div class="nav_dropdown_menu">
                    <div class="nav_dropdown_panel">
                        <div class="nav_dropdown_item" onclick="window.location.href='TCTC2-0-main.html'">主線模式</div>
                        <div class="nav_dropdown_item" onclick="window.location.href='TCTC2-0-challenge_lobby.html'">挑戰模式</div>

    <main class="achv_main_style">
        <section class="achv_first_section">
            <div class="main_lobby_main_frame">
                <div class="main_lobby_back_to_intro_button" onclick="window.history.back()">
                    <img src="back_pointer_gold.png" alt="返回">
                </div>
            </div>

            <div class="achv_container">
                <div class="achv_header">
                    <p class="achv_page_subtitle">TCTC 繁體中文打字網站</p>
                    <h1 class="achv_page_title">個人榮譽牆</h1>
                </div>

                <!-- ===== 內容區：訪客跟已登入玩家都看得到，跟排行榜的 anon_id 機制一致 =====
                     不像帳號系統那樣要求登入才能用——這裡的資料是綁在瀏覽器的 anon_id
                     （跟 WPM／正確率／瀏覽次數同一套身分），訪客照樣能累積。
                     唯一的差別只在於：換瀏覽器/清除資料會變成新的 anon_id、紀錄重新開始，
                     這點如果想保留紀錄，登入帳號會比較保險（帳號會把 anon_id 綁定起來）。 -->
                <div class="achv_content" id="achv_content">

                    <!-- 連續登入天數：中央主數字（目前連續）+ 兩側輔助數字 -->
                    <div class="achv_streak_strip">
                        <div class="achv_streak_side">
                            <div class="achv_streak_value_sm" id="achv_longest_streak">—</div>
                            <div class="achv_streak_label">歷史最長連續</div>
                        </div>
                        <div class="achv_streak_center">
                            <div class="achv_streak_value_lg" id="achv_current_streak">—</div>
                            <div class="achv_streak_label">目前連續登入</div>
                        </div>
                        <div class="achv_streak_side">
                            <div class="achv_streak_value_sm" id="achv_total_days">—</div>
                            <div class="achv_streak_label">累積登入天數</div>
                        </div>
                    </div>

                    <p class="achv_streak_hint" id="achv_streak_hint"></p>

                    <!-- 徽章牆：里程碑徽章，依 total_login_days / longest_streak 判斷解鎖與否 -->
                    <div class="achv_badge_section">
                        <h2 class="achv_section_title">登入里程碑</h2>
                        <div class="achv_badge_grid" id="achv_badge_grid">
                            <!-- 由 TCTC2-0-achievements.js 動態產生 -->
                        </div>
                    </div>

                    <!-- 佔位區：之後打字相關成就（速度/正確率/挑戰模式）做出來後放這裡 -->
                    <div class="achv_badge_section">
                        <h2 class="achv_section_title">打字成就</h2>
                        <div class="achv_placeholder_panel">
                            <p class="achv_achievement_empty">尚未開放，敬請期待</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
