<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>排行榜 - TCTC 繁體中文打字練習中心</title>
    <meta name="description" content="查看各關卡的打字速度排行榜，看看自己的WPM在所有玩家中排第幾名！">
    <meta name="robots" content="index, follow">

    <meta name="google-site-verification" content="fHfTpW9ouqdLEFGEQhLvwelT1xdZ7Sxmi-iKBHY7S_8" /> <!--google驗證-->

    <!--瀏覽器分頁小圖-->
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">

    <!-- 社群分享預覽圖-->
    <meta property="og:image" content="https://lucaslai991207.github.io/tctc/os_image.png">
    <meta property="og:title" content="TCTC 繁體中文打字中心 - 排行榜">

    <link rel="stylesheet" href="TCTC2-0-main_lobby.css">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
    <nav id="nav">
        <img src="TCTC2.0 logo.png" class="logo_style" onclick="window.location.href='TCTC2-0-main.html'">
        <div class="nav_css">
            <div onclick="window.location.href='TCTC2-0-details.html'">常見問題</div>
            <div class="nav_dropdown">
                模式 <span class="nav_dropdown_arrow">≡</span>
                <div class="nav_dropdown_menu">
                    <div class="nav_dropdown_panel">
                        <div class="nav_dropdown_item" onclick="window.location.href='TCTC2-0-main.html'">主線模式</div>
                        <div class="nav_dropdown_item" onclick="window.location.href='TCTC2-0-challenge_lobby.html'">挑戰模式</div>
                    </div>
                </div>
            </div>
            <div class="nav_dropdown">
                更多 <span class="nav_dropdown_arrow">≡</span>
                <div class="nav_dropdown_menu">
                    <div class="nav_dropdown_panel">
                        <div class="nav_dropdown_item" onclick="window.location.href='TCTC2-0-ranking.html'">排行榜</div>
                        <div class="nav_dropdown_item" onclick="window.location.href='TCTC2-0-profile.html'">設定</div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="ranking_main_style">
        <section class="ranking_first_section">
            <div class="main_lobby_main_frame">
                <div class="main_lobby_back_to_intro_button" onclick="window.location.href='TCTC2-0-main.html'">
                    ←
                </div>
            </div>

            <div class="ranking_container">
                <div class="ranking_header">
                    <!-- 【新增】網站總瀏覽次數：放在整個排行榜區塊最上方，不受下面「主線關卡/挑戰模式/玩家總榜」
                         分頁切換影響，隨時都會顯示。初始文字先給「載入中...」，等 TCTC2-0-ranking.js
                         呼叫 Get_Total_Page_Views() 拿到雲端數字後才會被換掉。 -->
                    <p class="ranking_total_views" id="ranking_total_views">網站總瀏覽次數：載入中...</p><br>

                    <h1 class="ranking_title">Top 50 排行榜</h1>
                    <p class="ranking_subtitle" id="ranking_stage_label">載入中...</p>
                    <p class="ranking_subtitle2" id="ranking_stage_label2">載入中...</p>

                </div>

                <div class="ranking_mode_tabs">
                    <button type="button" class="ranking_mode_tab ranking_mode_tab_active" id="ranking_mode_tab_stage" onclick="Switch_Ranking_Mode('stage')">主線關卡</button>
                    <button type="button" class="ranking_mode_tab" id="ranking_mode_tab_challenge" onclick="Switch_Ranking_Mode('challenge')">挑戰模式</button>
                    <!-- 【新增】玩家總榜：不綁定特定關卡/組合，統計「這個玩家整體表現」 -->
                    <button type="button" class="ranking_mode_tab" id="ranking_mode_tab_player" onclick="Switch_Ranking_Mode('player')">玩家總榜</button>
                </div>

                <div class="ranking_selector_row" id="ranking_stage_selector_row">
                    <select id="ranking_difficulty_select" class="ranking_select"></select>
                    <select id="ranking_chapter_select" class="ranking_select"></select>
                    <select id="ranking_stage_select" class="ranking_select"></select>
                </div>

                <div class="ranking_selector_row is_hidden" id="ranking_challenge_selector_row">
                    <select id="ranking_cg_difficulty_select" class="ranking_select"></select>
                    <select id="ranking_cg_stage_select" class="ranking_select"></select>
                    <select id="ranking_cg_seconds_select" class="ranking_select"></select>
                </div>

                <div class="ranking_selector_row is_hidden" id="ranking_player_selector_row">
                    <button type="button" class="ranking_select ranking_select_active" id="ranking_player_metric_wpm" onclick="Switch_Player_Metric('avg_wpm')">平均WPM最高</button>
                    <button type="button" class="ranking_select" id="ranking_player_metric_acc" onclick="Switch_Player_Metric('avg_acc')">平均正確率最高</button>
                    <button type="button" class="ranking_select" id="ranking_player_metric_online" onclick="Switch_Player_Metric('online_seconds')">在線時長最長</button>
                    <button type="button" class="ranking_select" id="ranking_player_metric_points" onclick="Switch_Player_Metric('total_points')">積分最高</button>
                    <!-- 【新增】瀏覽次數最多榜：跟其他 3 顆按鈕結構完全一樣，只是 metric 參數換成 "page_views" -->
                    <button type="button" class="ranking_select" id="ranking_player_metric_views" onclick="Switch_Player_Metric('page_views')">瀏覽次數最多</button>
                </div>

                <div class="ranking_list_wrap">
                    <div class="ranking_list_header">
                        <div class="rank_col_rank">名次</div>
                        <div class="rank_col_name">玩家</div>
                        <div class="rank_col_wpm" id="ranking_col_header_metric1">WPM</div>
                        <div class="rank_col_acc" id="ranking_col_header_metric2">正確率</div>
                    </div>
                    <div id="ranking_list_body"></div>
                    <div id="ranking_loading_msg" class="ranking_loading_msg">載入中...</div>
                    <div id="ranking_empty_msg" class="ranking_empty_msg is_hidden">
                        這一關目前還沒有任何人上榜，快去挑戰第一名吧！
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="intro_footer">
        <div class="footer_div">
            <div class="footer_col">
                <p class="footer_col_title">回報問題</p>

            </div>
            <div class="footer_col">
                <p class="footer_col_title">聯絡我們</p>

            </div>
            <div class="footer_col">
                <p class="footer_col_title">平台連結</p>
                <a class="footer_link" href="https://www.youtube.com/channel/UCIA5fwMrvGpvcQbG0ZX2ZLA" target="_blank" rel="noopener">Youtube</a>   
            </div>
        </div>
        
        <div class="footer_copyright">
            &copy; 2026 TCTC2.0 繁中打字中心. All Rights Reserved.
        </div>
    </footer>
