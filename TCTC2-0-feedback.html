        <main class="profile_main_style" style="justify-content: flex-start;">
            <section class="profile_first_section">
                <div class="profile_page_header" style="text-align: left; max-width: 46rem; margin: 3rem auto 2rem; padding: 0 1.2rem;">
                    <h1 class="profile_page_title" style="margin-top: 0; text-align: center;">意見回報</h1>
                    <p class="profile_page_subtitle">錯誤回報、功能建議，或任何想讓我們知道的事</p>
                </div>

                <div style="max-width: 46rem; margin: 0 auto; padding: 0 1.2rem;">
                    <div class="profile_card">

                        <p class="profile_field_label">類別</p>
                        <div class="vp_report_category_list" id="feedback_category_list" style="margin-bottom: 1.4rem;">
                            <label class="vp_report_category_item">
                                <input type="radio" name="feedback_category" value="bug" checked>錯誤回報
                            </label>
                            <label class="vp_report_category_item">
                                <input type="radio" name="feedback_category" value="suggestion">功能建議
                            </label>
                            <label class="vp_report_category_item">
                                <input type="radio" name="feedback_category" value="other">其他
                            </label>
                        </div>

                        <label class="profile_field_label" for="feedback_title">標題（選填）</label>
                        <input type="text" class="profile_input" id="feedback_title" maxlength="50" placeholder="簡單描述一下，例如：排行榜載入不出來" style="margin-bottom: 1.2rem;">

                        <label class="profile_field_label" for="feedback_content">詳細內容</label>
                        <textarea class="profile_textarea" id="feedback_content" maxlength="1000" placeholder="請盡量描述詳細一點，例如：發生的頁面、操作步驟、看到什麼結果……都會很有幫助"></textarea>

                        <label class="profile_field_label" for="feedback_contact">聯絡方式（選填）</label>
                        <input type="text" class="profile_input" id="feedback_contact" maxlength="100" placeholder="Email 或 Discord，方便的話我們想跟進時可以聯絡你">

                        <p class="profile_username_warning" id="feedback_error"></p>

                        <button type="button" class="profile_update_btn" id="feedback_submit_btn" onclick="Submit_Feedback_Form()">送出</button>
                    </div>
                </div>
            </section>
        </main>

        <div id="feedback_toast" class="profile_toast"></div>

        <footer class="intro_footer">
            <div class="footer_div">
                <div class="footer_col">
                    <p class="footer_col_title">聯絡我們</p>
